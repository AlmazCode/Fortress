schema_version = "1.0"
profile = "production"
# Read secrets from environment: FORTRESS_API_KEY, DATABASE_URL, REDIS_URL.
# Runtime paths must be absolute, local, outside tracked Git; configure before launch.
runtime_root = ""
release_root = ""
[limits]
max_upload_bytes = 209715200
max_duration_sec = 180
max_long_edge = 1920
max_short_edge = 1080
max_fps = 60
deadline_sec = 240
max_unfinished_jobs = 1
worker_concurrency = 1
worker_prefetch_multiplier = 1
cpu_threads = 2
[model]
backbone = "mobilenet_v3_small"
weights = "IMAGENET1K_V1"
feature_dim = 576
gru_hidden_size = 256
gru_layers = 1
freeze_encoder = true
[preprocessing]
version = "letterbox-v1"
size = 224
fps = 2
window_frames = 32
overlap = 0.5
views = 1
resize = "letterbox"
mean = [0.485, 0.456, 0.406]
std = [0.229, 0.224, 0.225]
