[project]
name = "fortress"
version = "0.1.0"
description = "Local cash-video analysis; software implementation, training deferred"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6", "redis>=5,<7",
  "jsonschema>=4.23,<5", "referencing>=0.35,<1",
  "pillow>=11,<13", "pyyaml>=6,<7"
]

[project.optional-dependencies]
ml = [
  "torch>=2.9,<3", "torchvision>=0.24,<1", "numpy>=2,<3",
  "scikit-learn>=1.6,<2", "pandas>=2,<4", "tensorboard>=2,<3",
  "tqdm>=4.66,<5", "safetensors>=0.5,<1",
  "opencv-python-headless>=4.10,<5", "av>=14,<18"
]
ml-cuda = [
  "torch==2.11.0", "torchvision==0.26.0", "numpy>=2,<3",
  "scikit-learn>=1.6,<2", "pandas>=2,<4", "tensorboard>=2,<3",
  "tqdm>=4.66,<5", "safetensors>=0.5,<1",
  "opencv-python-headless>=4.10,<5", "av>=14,<18"
]

[dependency-groups]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.27,<1", "openapi-spec-validator>=0.7,<1"]

[tool.uv]
package = false
conflicts = [[{extra = "ml"}, {extra = "ml-cuda"}]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "ml", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cuda", extra = "ml-cuda", marker = "sys_platform != 'darwin'" }
]
torchvision = [
  { index = "pytorch-cpu", extra = "ml", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cuda", extra = "ml-cuda", marker = "sys_platform != 'darwin'" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
