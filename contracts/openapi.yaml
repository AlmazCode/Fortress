{
  "openapi": "3.1.0",
  "info": {
    "title": "Fortress API",
    "version": "1.0.0",
    "description": "Local analysis. Public jury JSON remains separate from internal diagnostics. Synthetic examples do not constitute model validation."
  },
  "security": [
    {
      "ApiKey": []
    }
  ],
  "paths": {
    "/api/v1/analyze": {
      "post": {
        "operationId": "analyze",
        "security": [
          {
            "ApiKey": []
          }
        ],
        "description": "Authenticate; reject unusable model/capacity; bounded stream, probe and decode; persist original and atomically commit job plus outbox. Return 202 only after durable acceptance. No inference in the request handler. A failed acceptance never returns a job id.",
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "required": [
                  "file"
                ],
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary"
                  }
                },
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Original and job/outbox durably saved",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Job/$defs/Accepted"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request or undecodable media",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Diagnostics/$defs/Error"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid X-API-Key",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Diagnostics/$defs/Error"
                }
              }
            }
          },
          "413": {
            "description": "Upload exceeds 200 MiB",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Diagnostics/$defs/Error"
                }
              }
            }
          },
          "415": {
            "description": "Unsupported container/codec/limits",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Diagnostics/$defs/Error"
                }
              }
            }
          },
          "429": {
            "description": "One unfinished job already occupies capacity",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Diagnostics/$defs/Error"
                }
              }
            }
          },
          "503": {
            "description": "Model not ready or infrastructure unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Diagnostics/$defs/Error"
                }
              }
            }
          }
        }
      }
    },
