    "/api/ui/v1/jobs/{job_id}/media": {
      "get": {
        "operationId": "getOriginalMedia",
        "security": [
          {
            "ApiKey": []
          }
        ],
        "parameters": [
          {
            "name": "job_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "description": "Protected whole-file fetch with X-API-Key; create an in-memory Blob URL for video playback/seek, then revoke it. No key in URL/storage/logs/bundle. Preview timeline maps to original elapsed PTS; evidence uses original frames. One configured shared key is not per-user isolation.",
        "responses": {
          "200": {
            "description": "Local media; at most 200 MiB. Never expose filesystem paths.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "const": "private, no-store"
                }
              }
            },
            "content": {
              "video/mp4": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              },
              "video/quicktime": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request or undecodable media",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Diagnostics/$defs/Error"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid X-API-Key",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Diagnostics/$defs/Error"
                }
              }
            }
          },
          "404": {
            "description": "Unknown job or unavailable media",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Diagnostics/$defs/Error"
                }
              }
            }
          },
          "503": {
            "description": "Model not ready or infrastructure unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Diagnostics/$defs/Error"
                }
              }
            }
          }
        }
      }
    },
