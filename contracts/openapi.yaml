    "/api/ui/v1/jobs/{job_id}/frames/{frame_id}": {
      "get": {
        "operationId": "getEvidenceFrame",
        "security": [
          {
            "ApiKey": []
          }
        ],
        "parameters": [
          {
            "name": "job_id",
            "in": "path",
            "required": true,
            "schema": {
