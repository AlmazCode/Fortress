  "components": {
    "securitySchemes": {
      "ApiKey": {
        "type": "apiKey",
        "in": "header",
        "name": "X-API-Key"
      }
    },
    "schemas": {
      "Job": {
        "title": "Fortress job v1",
        "oneOf": [
          {
            "$ref": "#/components/schemas/Job/$defs/Processing"
          },
          {
            "$ref": "#/components/schemas/Job/$defs/Done"
          },
          {
            "$ref": "#/components/schemas/Job/$defs/Failed"
          }
        ],
        "$defs": {
          "Processing": {
            "type": "object",
            "properties": {
              "job_id": {
                "type": "string",
                "format": "uuid"
              },
              "status": {
                "const": "processing"
              }
            },
            "required": [
              "job_id",
              "status"
            ],
            "additionalProperties": false
          },
          "Done": {
            "type": "object",
            "properties": {
              "job_id": {
                "type": "string",
                "format": "uuid"
              },
              "status": {
                "const": "done"
              },
              "verdict": {
                "enum": [
                  "violation",
                  "no_violation"
                ]
              },
              "violations": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "type": {
                      "type": "string",
                      "minLength": 1
                    },
                    "timecode_sec": {
                      "type": "number",
                      "minimum": 0
                    },
                    "description": {
                      "type": "string",
                      "minLength": 1
                    },
                    "evidence_frames": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "timestamp_sec": {
                            "type": "number",
                            "minimum": 0
                          },
                          "image_base64": {
                            "type": "string",
                            "minLength": 16,
                            "maxLength": 8388608,
                            "pattern": "^/9j/[A-Za-z0-9+/]*={0,2}$"
                          }
                        },
                        "required": [
                          "timestamp_sec",
                          "image_base64"
                        ],
                        "additionalProperties": false
                      },
                      "minItems": 1,
                      "maxItems": 3
                    }
                  },
                  "required": [
                    "type",
                    "timecode_sec",
                    "description",
                    "evidence_frames"
                  ],
                  "additionalProperties": false
                }
              }
            },
            "required": [
              "job_id",
              "status",
              "verdict",
              "violations"
            ],
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "properties": {
                    "verdict": {
                      "const": "violation"
                    }
                  },
                  "required": [
                    "verdict"
                  ]
                },
                "then": {
                  "properties": {
                    "violations": {
                      "minItems": 1
                    }
                  }
                }
              },
              {
                "if": {
                  "properties": {
                    "verdict": {
                      "const": "no_violation"
                    }
                  },
                  "required": [
                    "verdict"
                  ]
                },
                "then": {
                  "properties": {
                    "violations": {
                      "maxItems": 0
                    }
                  }
                }
              }
            ]
          },
          "Failed": {
            "type": "object",
            "properties": {
              "job_id": {
                "type": "string",
                "format": "uuid"
              },
              "status": {
                "const": "failed"
              },
              "reason": {
                "enum": [
                  "insufficient_evidence",
                  "deadline_exceeded",
                  "decode_failed",
                  "inference_failed",
                  "evidence_failed",
                  "worker_lost",
                  "internal_error",
                  "release_invalid"
                ]
              }
            },
            "required": [
              "job_id",
              "status",
              "reason"
            ],
            "additionalProperties": false
          },
          "EvidenceFrame": {
            "type": "object",
            "properties": {
              "timestamp_sec": {
                "type": "number",
                "minimum": 0
              },
              "image_base64": {
                "type": "string",
                "minLength": 16,
                "maxLength": 8388608,
                "pattern": "^/9j/[A-Za-z0-9+/]*={0,2}$"
              }
            },
            "required": [
              "timestamp_sec",
              "image_base64"
            ],
            "additionalProperties": false
          },
          "Violation": {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "minLength": 1
              },
              "timecode_sec": {
                "type": "number",
                "minimum": 0
              },
              "description": {
                "type": "string",
                "minLength": 1
              },
              "evidence_frames": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "timestamp_sec": {
                      "type": "number",
                      "minimum": 0
                    },
                    "image_base64": {
                      "type": "string",
                      "minLength": 16,
                      "maxLength": 8388608,
                      "pattern": "^/9j/[A-Za-z0-9+/]*={0,2}$"
                    }
                  },
                  "required": [
                    "timestamp_sec",
                    "image_base64"
                  ],
                  "additionalProperties": false
                },
                "minItems": 1,
                "maxItems": 3
              }
            },
            "required": [
              "type",
              "timecode_sec",
              "description",
              "evidence_frames"
            ],
            "additionalProperties": false
          },
          "Accepted": {
            "type": "object",
            "properties": {
              "job_id": {
                "type": "string",
                "format": "uuid"
              }
            },
            "required": [
              "job_id"
            ],
            "additionalProperties": false
          }
        }
      },
      "Diagnostics": {
        "title": "Fortress diagnostics v1",
        "oneOf": [
          {
            "$ref": "#/components/schemas/Diagnostics/$defs/Job"
          },
          {
            "$ref": "#/components/schemas/Diagnostics/$defs/Model"
          },
          {
            "$ref": "#/components/schemas/Diagnostics/$defs/Error"
          }
        ],
        "$defs": {
          "Job": {
            "type": "object",
            "properties": {
              "schema_version": {
                "const": "1.0"
              },
              "job_id": {
                "type": "string",
                "format": "uuid"
              },
              "public": {
                "$ref": "#/components/schemas/Job"
              },
              "stage": {
                "enum": [
                  "validation",
                  "queued",
                  "decoding",
                  "inference",
                  "rules",
                  "evidence",
                  "done",
                  "failed"
                ]
              },
              "processed_sec": {
                "anyOf": [
                  {
                    "type": "number",
                    "minimum": 0
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "duration_sec": {
                "type": "number",
                "minimum": 0
              },
              "coverage": {
                "enum": [
                  "full",
                  "partial",
                  "none"
                ]
              },
              "unknown": {
                "type": "array",
                "items": {
                  "type": "string",
                  "minLength": 1
                }
              },
              "unsupported": {
                "type": "array",
                "items": {
                  "type": "string",
                  "minLength": 1
                }
              },
              "limitations": {
                "type": "array",
                "items": {
                  "type": "string",
                  "minLength": 1
                }
              },
              "versions": {
                "type": "object",
                "properties": {
                  "dataset": {
                    "anyOf": [
                      {
                        "type": "string",
                        "minLength": 1
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "annotations": {
                    "anyOf": [
                      {
                        "type": "string",
                        "minLength": 1
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "split": {
                    "anyOf": [
                      {
                        "type": "string",
                        "minLength": 1
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "rules": {
                    "anyOf": [
                      {
                        "type": "string",
                        "minLength": 1
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "model": {
                    "anyOf": [
                      {
                        "type": "string",
                        "minLength": 1
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "preprocessing": {
                    "anyOf": [
                      {
                        "type": "string",
                        "minLength": 1
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "taxonomy": {
                    "anyOf": [
                      {
                        "type": "string",
                        "minLength": 1
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": [
                  "dataset",
                  "annotations",
                  "split",
                  "rules",
                  "model",
                  "preprocessing",
                  "taxonomy"
                ],
                "additionalProperties": false
              },
              "timeline": {
                "anyOf": [
                  {
                    "$ref": "#/components/schemas/Events"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "media": {
                "type": "object",
                "properties": {
                  "original": {
                    "anyOf": [
                      {
                        "type": "object",
                        "properties": {
                          "url": {
                            "type": "string",
                            "pattern": "^/api/ui/v1/jobs/[a-f0-9-]+/(?:media|preview|frames/[A-Za-z0-9_-]+)$"
                          },
                          "content_type": {
                            "enum": [
                              "video/mp4",
                              "video/quicktime",
                              "image/jpeg"
                            ]
                          },
                          "max_bytes": {
                            "type": "integer",
